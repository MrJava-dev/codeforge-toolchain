name: Build CodeForge Toolchain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.2.23'
        type: string
      include_python:
        description: 'Include Python 3 runtime + pip'
        required: false
        default: false
        type: boolean
      include_node:
        description: 'Include Node.js + npm'
        required: false
        default: false
        type: boolean
      include_native:
        description: 'Include clang, make, cmake, binutils'
        required: false
        default: false
        type: boolean
      include_lua:
        description: 'Include Lua 5.4 + luarocks'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: toolchain-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_INDEX_URL: https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
  TERMUX_MIRROR_1: https://packages.termux.dev/apt/termux-main
  TERMUX_MIRROR_2: https://mirror.utermux.dev/termux/termux-main
  TERMUX_MIRROR_3: https://grimler.se/termux/termux-main

  TARBALL_NAME: toolchain-aarch64
  WORK_DIR: build
  CACHE_VERSION: 'v5'

  MAX_RETRIES: '3'
  RETRY_DELAY_SECONDS: '5'
  CONNECT_TIMEOUT: '30'

  MIN_TARBALL_BYTES: '100000000'
  MAX_TARBALL_BYTES: '2000000000'

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Check network
        run: |
          set -uo pipefail
          index_ok=false
          for url in "$TERMUX_INDEX_URL"; do
            if curl -fsSL --connect-timeout "$CONNECT_TIMEOUT" --max-time 60 -o /dev/null "$url"; then
              index_ok=true; break
            fi
          done
          if [ "$index_ok" = "false" ]; then
            echo "::error::Termux index not reachable"; exit 1
          fi

      - name: Report config
        run: |
          echo "Tag: ${{ steps.tag.outputs.tag }}"

  fetch-index:
    name: Fetch Termux index
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 10
    steps:
      - name: Cache index
        id: cache-index
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/Packages
          key: termux-index-${{ env.CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: termux-index-${{ env.CACHE_VERSION }}-

      - name: Download index
        if: steps.cache-index.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          curl -fsSL -o Packages "$TERMUX_INDEX_URL"

      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: termux-index
          path: ${{ env.WORK_DIR }}/Packages
          retention-days: 7

  download:
    name: Download packages
    runs-on: ubuntu-22.04
    needs: [preflight, fetch-index]
    timeout-minutes: 60
    steps:
      - name: Download index
        uses: actions/download-artifact@v4
        with:
          name: termux-index
          path: ${{ env.WORK_DIR }}

      - name: Restore deb cache
        id: cache-debs
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/raw
          key: termux-debs-${{ env.CACHE_VERSION }}-${{ hashFiles('build/Packages') }}
          restore-keys: termux-debs-${{ env.CACHE_VERSION }}-

      - name: Prepare directory
        run: mkdir -p "$WORK_DIR/raw"

      - name: Download each package
        run: |
          set -uo pipefail
          cd "$WORK_DIR"
          DOWNLOAD_DIR="$PWD/raw"
          MISSING_FILE="$PWD/missing-packages.txt"
          : > "$MISSING_FILE"

          find_deb_path() {
            awk -v p="$1" '/^Package: / { name=$2 } /^Filename: / { if (name==p) { print $2; exit } }' Packages | head -1
          }

          sanitize() { printf '%s' "$1" | tr ':' '_' | tr -d '<>:"|?*' | tr -d '\r\n'; }

          download_from_mirrors() {
            local pkg_path="$1"
            local out_file="$2"
            for mirror in "$TERMUX_MIRROR_1" "$TERMUX_MIRROR_2" "$TERMUX_MIRROR_3"; do
              for attempt in 1 2 3; do
                if curl -fsSL --connect-timeout "$CONNECT_TIMEOUT" --max-time 300 -o "$out_file.tmp" "$mirror/$pkg_path"; then
                  mv "$out_file.tmp" "$out_file"; return 0
                fi
                sleep 2
              done
            done
            return 1
          }

          # ADDED libc++ HERE
          REQUIRED="openjdk-17 libandroid-shmem libandroid-spawn libc++ gradle kotlin aapt2 apksigner d8 bash coreutils findutils grep sed tar gzip xz-utils openssl ca-certificates zlib libandroid-support libiconv ncurses readline libexpat"
          OPTIONAL=""
          if [ "${{ github.event.inputs.include_python }}" = "true" ]; then OPTIONAL="$OPTIONAL python python-pip"; fi
          if [ "${{ github.event.inputs.include_node }}" = "true" ]; then OPTIONAL="$OPTIONAL nodejs"; fi
          if [ "${{ github.event.inputs.include_native }}" = "true" ]; then OPTIONAL="$OPTIONAL clang make cmake binutils pkg-config"; fi
          if [ "${{ github.event.inputs.include_lua }}" = "true" ]; then OPTIONAL="$OPTIONAL lua54 luarocks"; fi

          ALL="$REQUIRED $OPTIONAL"
          echo "$ALL" | tr ' ' '\n' | grep -v '^$' | sort -u > "package-list.txt"

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            deb_path=$(find_deb_path "$pkg")
            if [ -z "$deb_path" ]; then echo "  ✗ MISSING: $pkg"; echo "$pkg" >> "$MISSING_FILE"; continue; fi

            safe_name=$(sanitize "$(basename "$deb_path")")
            out_file="$DOWNLOAD_DIR/$safe_name"

            if [ ! -f "$out_file" ] || [ ! -s "$out_file" ]; then
              echo "  → Fetching: $pkg"
              if ! download_from_mirrors "$deb_path" "$out_file"; then
                echo "  ✗ FAILED: $pkg"; exit 1
              fi
            fi
          done < package-list.txt

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: termux-debs
          path: ${{ env.WORK_DIR }}/raw
          retention-days: 7

  extract:
    name: Extract and flatten
    runs-on: ubuntu-22.04
    needs: download
    timeout-minutes: 30
    steps:
      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: termux-debs
          path: ${{ env.WORK_DIR }}/raw

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils zstd xz-utils

      - name: Extract every .deb
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          mkdir -p extracted
          EXTRACTED=0

          while IFS= read -r -d '' deb; do
            TMPD=$(mktemp -d)
            ABS=$(realpath "$deb")
            if (cd "$TMPD" && ar x "$ABS" 2>/dev/null); then
              FOUND=""
              for candidate in data.tar.xz data.tar.gz data.tar.zst data.tar.bz2 data.tar; do
                if [ -f "$TMPD/$candidate" ]; then FOUND="$candidate"; break; fi
              done

              if [ -n "$FOUND" ]; then
                case "$FOUND" in
                  "data.tar.xz")  tar -xf "$TMPD/data.tar.xz"  -C extracted ;;
                  "data.tar.gz")  tar -xf "$TMPD/data.tar.gz"  -C extracted ;;
                  "data.tar.bz2") tar -xf "$TMPD/data.tar.bz2" -C extracted ;;
                  "data.tar")     tar -xf "$TMPD/data.tar"     -C extracted ;;
                  "data.tar.zst") zstd -d "$TMPD/data.tar.zst" -o "$TMPD/data.tar" -f && tar -xf "$TMPD/data.tar" -C extracted ;;
                esac
                EXTRACTED=$((EXTRACTED+1))
              fi
            fi
            rm -rf "$TMPD"
          done < <(find raw -name '*.deb' -type f -print0)

          if [ "$EXTRACTED" -eq 0 ]; then echo "::error::Nothing extracted"; exit 1; fi

          PREFIX_DIR=$(find extracted -type d -path '*com.termux/files/usr' | head -1)
          if [ -n "$PREFIX_DIR" ]; then
            shopt -s dotglob
            for item in "$PREFIX_DIR"/*; do
              base=$(basename "$item")
              if [ -e "extracted/$base" ] && [ "$base" != "$item" ]; then
                if [ -d "$item" ] && [ -d "extracted/$base" ]; then cp -rn "$item"/* "extracted/$base/" 2>/dev/null || true;
                else cp -rn "$item" extracted/ 2>/dev/null || true; fi
              else mv "$item" extracted/; fi
            done
            shopt -u dotglob
            rm -rf extracted/data
          fi

      - name: Upload extracted tree
        uses: actions/upload-artifact@v4
        with:
          name: extracted-tree
          path: ${{ env.WORK_DIR }}/extracted
          retention-days: 3
          compression-level: 0

  patch:
    name: Patch RPATH
    runs-on: ubuntu-22.04
    needs: extract
    timeout-minutes: 20
    steps:
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Download tree
        uses: actions/download-artifact@v4
        with:
          name: extracted-tree
          path: ${{ env.WORK_DIR }}/extracted
      - name: Patch ELF binaries
        run: |
          cd "$WORK_DIR/extracted"
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "ELF"; then
              patchelf --set-rpath '$ORIGIN/../lib' "$file" 2>/dev/null || true
            fi
          done < <(find bin -type f -print0 2>/dev/null)
          
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "ELF"; then
              patchelf --set-rpath '$ORIGIN' "$file" 2>/dev/null || true
            fi
          done < <(find lib -type f -name '*.so*' -print0 2>/dev/null)

          if [ -d opt ]; then
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q "ELF"; then
                patchelf --set-rpath '$ORIGIN/../../lib' "$file" 2>/dev/null || true
              fi
            done < <(find opt -type f -executable -print0 2>/dev/null)
          fi

          if [ -d lib/jvm ]; then
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q "ELF"; then
                patchelf --set-rpath '$ORIGIN/../../../lib' "$file" 2>/dev/null || true
              fi
            done < <(find lib/jvm -type f \( -name 'java' -o -name 'javac' -o -name 'jar' -o -name 'keytool' \) -print0 2>/dev/null)
          fi
      - name: Upload patched tree
        uses: actions/upload-artifact@v4
        with:
          name: patched-tree
          path: ${{ env.WORK_DIR }}/extracted
          retention-days: 3
          compression-level: 0

  package:
    name: Package tarball
    runs-on: ubuntu-22.04
    needs: patch
    timeout-minutes: 20
    steps:
      - name: Download tree
        uses: actions/download-artifact@v4
        with:
          name: patched-tree
          path: ${{ env.WORK_DIR }}/extracted
      - name: Pack tarball
        run: |
          cd "$WORK_DIR/extracted"
          tar -cJhf "../$TARBALL_NAME.tar.xz" .
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ env.WORK_DIR }}/${{ env.TARBALL_NAME }}.tar.xz
          retention-days: 14
          compression-level: 0

  release:
    name: Create release
    runs-on: ubuntu-22.04
    needs: [preflight, package]
    timeout-minutes: 30
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball
          path: ${{ env.WORK_DIR }}
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/releases/tags/$TAG")
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            UPLOAD_URL=$(echo "$EXISTING" | jq -r '.upload_url' | sed 's/{?name,label}//')
          else
            CREATED=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Toolchain $TAG\"}")
            UPLOAD_URL=$(echo "$CREATED" | jq -r '.upload_url' | sed 's/{?name,label}//')
          fi

          ASSET_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/releases/tags/$TAG" | jq -r ".assets[] | select(.name==\"$TARBALL_NAME.tar.xz\") | .id")
          if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "$API/releases/assets/$ASSET_ID"
          fi

          cd "$WORK_DIR"
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$TARBALL_NAME.tar.xz" \
            "$UPLOAD_URL?name=$TARBALL_NAME.tar.xz"
