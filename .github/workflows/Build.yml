name: Build toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils wget xz-utils jq

      - name: Fetch Termux package index
        run: |
          mkdir -p work && cd work
          curl -sLO https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages

      - name: Download OpenJDK + Gradle + deps
        run: |
          cd work
          fetch() {
            local pkg=$1
            local path=$(awk -v p="$pkg" '
              /^Package: / { name=$2 }
              /^Filename: / { if (name==p) { print $2; exit } }
            ' Packages | head -1)
            if [ -z "$path" ]; then echo "MISSING: $pkg"; return 0; fi
            echo "Fetching $pkg -> $path"
            curl -sLO "https://packages.termux.dev/apt/termux-main/$path"
          }

          fetch openjdk-17
          fetch openjdk-17-x
          fetch gradle
          fetch aapt2
          fetch apksigner
          fetch d8
          fetch kotlin
          fetch bash
          fetch coreutils
          fetch findutils
          fetch grep
          fetch sed
          fetch tar
          fetch gzip
          fetch xz-utils
          fetch openssl
          fetch ca-certificates
          fetch zlib
          fetch libandroid-support
          fetch libiconv
          fetch ncurses
          fetch readline
          fetch libexpat

          ls -la

      - name: Extract and flatten
        run: |
          cd work
          mkdir -p extracted
          for deb in *.deb; do
            ar x "$deb" data.tar.xz 2>/dev/null || ar x "$deb" data.tar.gz 2>/dev/null || continue
            if [ -f data.tar.xz ]; then tar -xf data.tar.xz -C extracted; rm data.tar.xz; fi
            if [ -f data.tar.gz ]; then tar -xf data.tar.gz -C extracted; rm data.tar.gz; fi
          done

          echo "=== Before flatten ==="
          ls -la extracted | head

          # Termux .deb extracts to data/data/com.termux/files/usr/...
          # Move its contents up so bin/ and lib/ sit at the top
          if [ -d "extracted/data/data/com.termux/files/usr" ]; then
            echo "Flattening Termux prefix..."
            shopt -s dotglob
            mv extracted/data/data/com.termux/files/usr/* extracted/
            shopt -u dotglob
            rm -rf extracted/data
          fi

          echo "=== After flatten ==="
          ls -la extracted
          echo "=== bin/ contents (first 30) ==="
          ls -la extracted/bin | head -30 || echo "NO BIN DIR FOUND"

      - name: Patch RPATH for Android relocatable paths
        run: |
          cd work/extracted
          if [ ! -d bin ]; then
            echo "ERROR: bin/ missing — flatten step failed"
            exit 1
          fi
          find bin -type f -exec patchelf --set-rpath '$ORIGIN/../lib' {} \; 2>/dev/null || true
          find lib -name "*.so*" -type f -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
          find . -type f -executable ! -path "./bin/*" \
            -exec patchelf --set-rpath '$ORIGIN/../lib' {} \; 2>/dev/null || true

      - name: Rewrite Termux prefix references
        run: |
          cd work/extracted
          PREFIX='/data/data/com.termux/files/usr'
          grep -rl "$PREFIX" . 2>/dev/null | while read f; do
            sed -i "s|$PREFIX||g" "$f" || true
          done

      - name: Pack final tarball
        run: |
          cd work/extracted
          tar -cJf ../../toolchain-aarch64.tar.xz .
          cd ../..
          ls -lh toolchain-aarch64.tar.xz

      - name: Create release and upload tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1"

          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Toolchain $TAG\",\"draft\":false,\"prerelease\":false}")

          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Create failed, looking up existing release..."
            RELEASE_RESPONSE=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          fi

          if [ -z "$UPLOAD_URL" ]; then
            echo "Could not create or find release:"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          ASSET_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r '.assets[] | select(.name=="toolchain-aarch64.tar.xz") | .id // empty')

          if [ -n "$ASSET_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          fi

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @toolchain-aarch64.tar.xz \
            "$UPLOAD_URL?name=toolchain-aarch64.tar.xz"

          echo "Upload complete."
