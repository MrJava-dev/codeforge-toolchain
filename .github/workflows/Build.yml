name: Build CodeForge Toolchain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1, v2.1, latest)'
        required: true
        default: 'v1.2.23'
        type: string
      include_python:
        description: 'Include Python 3 runtime + pip'
        required: false
        default: false
        type: boolean
      include_node:
        description: 'Include Node.js + npm'
        required: false
        default: false
        type: boolean
      include_native:
        description: 'Include clang, make, cmake, binutils'
        required: false
        default: false
        type: boolean
      include_lua:
        description: 'Include Lua 5.4 + luarocks'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: toolchain-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_INDEX_URL: https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
  TERMUX_MIRROR_1: https://packages.termux.dev/apt/termux-main
  TERMUX_MIRROR_2: https://mirror.utermux.dev/termux/termux-main
  TERMUX_MIRROR_3: https://grimler.se/termux/termux-main

  TARBALL_NAME: toolchain-aarch64
  WORK_DIR: build
  CACHE_VERSION: 'v4'

  MAX_RETRIES: '3'
  RETRY_DELAY_SECONDS: '5'
  CONNECT_TIMEOUT: '30'

  MIN_TARBALL_BYTES: '100000000'
  MAX_TARBALL_BYTES: '2000000000'

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Check network
        run: |
          set -uo pipefail
          index_ok=false
          for url in "$TERMUX_INDEX_URL"; do
            echo "Probing index: $url"
            if curl -fsSL --connect-timeout "$CONNECT_TIMEOUT" --max-time 60 -o /dev/null "$url"; then
              echo "  ✓ reachable"
              index_ok=true
              break
            fi
          done
          if [ "$index_ok" = "false" ]; then
            echo "::error::Termux index not reachable"
            exit 1
          fi

      - name: Check disk space
        run: |
          set -euo pipefail
          df -h /
          AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          NEEDED_KB=$((3 * 1024 * 1024))
          if [ "$AVAIL_KB" -lt "$NEEDED_KB" ]; then
            echo "::error::Insufficient disk space"
            exit 1
          fi
          echo "Disk space OK: ${AVAIL_KB}KB available"

      - name: Report config
        run: |
          echo "════════════════════════════════════════════"
          echo "  BUILD CONFIGURATION"
          echo "════════════════════════════════════════════"
          echo "Tag:            ${{ steps.tag.outputs.tag }}"
          echo "Include Python: ${{ github.event.inputs.include_python || 'false' }}"
          echo "Include Node:   ${{ github.event.inputs.include_node || 'false' }}"
          echo "Include Native: ${{ github.event.inputs.include_native || 'false' }}"
          echo "Include Lua:    ${{ github.event.inputs.include_lua || 'false' }}"
          echo "════════════════════════════════════════════"

  fetch-index:
    name: Fetch Termux index
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 10
    steps:
      - name: Cache index
        id: cache-index
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/Packages
          key: termux-index-${{ env.CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            termux-index-${{ env.CACHE_VERSION }}-
            termux-index-

      - name: Download index
        if: steps.cache-index.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          downloaded=false
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt $attempt..."
            if curl -fsSL \
                --connect-timeout "$CONNECT_TIMEOUT" \
                --max-time 120 \
                --retry 3 \
                --retry-delay 5 \
                -o Packages \
                "$TERMUX_INDEX_URL"; then
              if [ -s Packages ]; then
                downloaded=true
                echo "  ✓ $(wc -l < Packages) lines"
                break
              fi
            fi
            sleep "$RETRY_DELAY_SECONDS"
          done
          if [ "$downloaded" = "false" ]; then
            echo "::error::Failed to download index"
            exit 1
          fi

      - name: Verify index
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          echo "Packages: $(grep -c '^Package: ' Packages)"
          for pkg in openjdk-17 libandroid-shmem libandroid-spawn gradle kotlin aapt2 apksigner d8; do
            if grep -q "^Package: $pkg$" Packages; then
              echo "  ✓ $pkg"
            else
              echo "  ✗ $pkg"
            fi
          done

      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: termux-index
          path: ${{ env.WORK_DIR }}/Packages
          retention-days: 7

  download:
    name: Download packages
    runs-on: ubuntu-22.04
    needs: [preflight, fetch-index]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download index
        uses: actions/download-artifact@v4
        with:
          name: termux-index
          path: ${{ env.WORK_DIR }}

      - name: Restore deb cache
        id: cache-debs
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/raw
          key: termux-debs-${{ env.CACHE_VERSION }}-${{ hashFiles('build/Packages') }}
          restore-keys: |
            termux-debs-${{ env.CACHE_VERSION }}-
            termux-debs-

      - name: Prepare directory
        run: mkdir -p "$WORK_DIR/raw"

      - name: Build package list
        id: pkglist
        run: |
          set -euo pipefail

          # ADDED libandroid-spawn HERE
          REQUIRED="openjdk-17 libandroid-shmem libandroid-spawn gradle kotlin aapt2 apksigner d8 bash coreutils findutils grep sed tar gzip xz-utils openssl ca-certificates zlib libandroid-support libiconv ncurses readline libexpat"

          OPTIONAL=""
          if [ "${{ github.event.inputs.include_python }}" = "true" ]; then
            OPTIONAL="$OPTIONAL python python-pip"
          fi
          if [ "${{ github.event.inputs.include_node }}" = "true" ]; then
            OPTIONAL="$OPTIONAL nodejs"
          fi
          if [ "${{ github.event.inputs.include_native }}" = "true" ]; then
            OPTIONAL="$OPTIONAL clang make cmake binutils pkg-config"
          fi
          if [ "${{ github.event.inputs.include_lua }}" = "true" ]; then
            OPTIONAL="$OPTIONAL lua54 luarocks"
          fi

          ALL="$REQUIRED $OPTIONAL"
          echo "$ALL" | tr ' ' '\n' | grep -v '^$' | sort -u > "$WORK_DIR/package-list.txt"
          echo "package_count=$(wc -l < "$WORK_DIR/package-list.txt")" >> "$GITHUB_OUTPUT"
          echo "Packages to fetch:"
          cat "$WORK_DIR/package-list.txt" | sed 's/^/  - /'

      - name: Download each package
        run: |
          set -uo pipefail

          cd "$WORK_DIR"
          DOWNLOAD_DIR="$PWD/raw"
          MISSING_FILE="$PWD/missing-packages.txt"
          FAILED_FILE="$PWD/failed-packages.txt"
          : > "$MISSING_FILE"
          : > "$FAILED_FILE"

          find_deb_path() {
            local pkg="$1"
            awk -v p="$pkg" '
              /^Package: / { name=$2 }
              /^Filename: / { if (name==p) { print $2; exit } }
            ' Packages | head -1
          }

          sanitize() {
            printf '%s' "$1" | tr ':' '_' | tr -d '<>:"|?*' | tr -d '\r\n'
          }

          download_from_mirrors() {
            local pkg_path="$1"
            local out_file="$2"
            for mirror in "$TERMUX_MIRROR_1" "$TERMUX_MIRROR_2" "$TERMUX_MIRROR_3"; do
              for attempt in 1 2 3; do
                local url="$mirror/$pkg_path"
                if curl -fsSL \
                    --connect-timeout "$CONNECT_TIMEOUT" \
                    --max-time 300 \
                    --retry 2 \
                    --retry-delay 3 \
                    -o "$out_file.tmp" \
                    "$url"; then
                  mv "$out_file.tmp" "$out_file"
                  echo "    ✓ $(basename "$out_file") from $mirror"
                  return 0
                fi
                echo "    ✗ $mirror attempt $attempt failed"
                sleep 2
              done
            done
            return 1
          }

          FAILED=0
          SUCCEEDED=0

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue

            deb_path=$(find_deb_path "$pkg")
            if [ -z "$deb_path" ]; then
              echo "  ✗ MISSING: $pkg"
              echo "$pkg" >> "$MISSING_FILE"
              continue
            fi

            raw_name=$(basename "$deb_path")
            safe_name=$(sanitize "$raw_name")
            out_file="$DOWNLOAD_DIR/$safe_name"

            if [ -f "$out_file" ] && [ -s "$out_file" ]; then
              echo "  ✓ CACHED: $pkg ($safe_name)"
              SUCCEEDED=$((SUCCEEDED + 1))
              continue
            fi

            echo "  → Fetching: $pkg → $safe_name"
            if download_from_mirrors "$deb_path" "$out_file"; then
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "  ✗ FAILED: $pkg"
              echo "$pkg" >> "$FAILED_FILE"
              FAILED=$((FAILED + 1))
            fi
          done < package-list.txt

          echo ""
          echo "════════════════════════════════════════════"
          echo "  DOWNLOAD SUMMARY"
          echo "════════════════════════════════════════════"
          echo "  Succeeded: $SUCCEEDED"
          echo "  Missing:   $(wc -l < "$MISSING_FILE")"
          echo "  Failed:    $FAILED"
          echo "════════════════════════════════════════════"

          if [ -s "$MISSING_FILE" ]; then
            echo "Missing:"
            sed 's/^/  - /' "$MISSING_FILE"
          fi

          if [ -s "$FAILED_FILE" ]; then
            echo "Failed:"
            sed 's/^/  - /' "$FAILED_FILE"
            echo "::warning::Some packages failed"
          fi

          CRITICAL="openjdk-17 gradle kotlin bash"
          for c in $CRITICAL; do
            if grep -q "^$c$" "$MISSING_FILE" 2>/dev/null; then
              echo "::error::Critical package missing: $c"
              exit 1
            fi
          done

          echo ""
          echo "Downloaded .deb files:"
          ls -lh "$DOWNLOAD_DIR" | tail -n +2

          BAD=$(find "$DOWNLOAD_DIR" -maxdepth 1 -type f ! -name '*.deb' | head -5)
          if [ -n "$BAD" ]; then
            echo ""
            echo "::warning::Files with unexpected extensions:"
            echo "$BAD" | sed 's/^/  - /'
          fi

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: termux-debs
          path: |
            ${{ env.WORK_DIR }}/raw
            ${{ env.WORK_DIR }}/package-list.txt
          retention-days: 7

  extract:
    name: Extract and flatten
    runs-on: ubuntu-22.04
    needs: download
    timeout-minutes: 30
    steps:
      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: termux-debs
          path: ${{ env.WORK_DIR }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd xz-utils

      - name: Extract every .deb
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          echo "════════════════════════════════════════════"
          echo "  PRE-EXTRACT: directory structure"
          echo "════════════════════════════════════════════"
          DEB_COUNT=$(find . -name '*.deb' -type f | wc -l)
          echo "Total .deb files: $DEB_COUNT"
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No .deb files anywhere in $WORK_DIR"
            exit 1
          fi

          mkdir -p extracted
          EXTRACTED=0

          while IFS= read -r -d '' deb; do
            TMPD=$(mktemp -d)
            ABS=$(realpath "$deb")
            if (cd "$TMPD" && ar x "$ABS" 2>/dev/null); then
              FOUND=""
              for candidate in data.tar.xz data.tar.gz data.tar.zst data.tar.bz2 data.tar; do
                if [ -f "$TMPD/$candidate" ]; then FOUND="$candidate"; break; fi
              done
              if [ -n "$FOUND" ]; then
                case "$FOUND" in
                  "data.tar.xz")  tar -xf "$TMPD/data.tar.xz"  -C extracted ;;
                  "data.tar.gz")  tar -xf "$TMPD/data.tar.gz"  -C extracted ;;
                  "data.tar.bz2") tar -xf "$TMPD/data.tar.bz2" -C extracted ;;
                  "data.tar")     tar -xf "$TMPD/data.tar"     -C extracted ;;
                  "data.tar.zst") zstd -d "$TMPD/data.tar.zst" -o "$TMPD/data.tar" -f && tar -xf "$TMPD/data.tar" -C extracted ;;
                esac
                EXTRACTED=$((EXTRACTED+1))
              fi
            fi
            rm -rf "$TMPD"
          done < <(find . -name '*.deb' -type f -print0)

          echo "Extracted $EXTRACTED packages."
          [ "$EXTRACTED" -eq 0 ] && { echo "::error::Nothing extracted"; exit 1; } || true

          PREFIX_DIR=$(find . -type d -path '*com.termux/files/usr' 2>/dev/null | head -1)
          if [ -n "$PREFIX_DIR" ]; then
            shopt -s dotglob
            for item in "$PREFIX_DIR"/*; do
              base=$(basename "$item")
              if [ -e "$base" ] && [ "$base" != "$item" ]; then
                if [ -d "$item" ] && [ -d "$base" ]; then
                  cp -rn "$item"/* "$base/" 2>/dev/null || true
                else
                  cp -rn "$item" . 2>/dev/null || true
                fi
              else
                mv "$item" .
              fi
            done
            shopt -u dotglob
            rm -rf data
            find . -type d -path '*com.termux*' -exec rm -rf {} + 2>/dev/null || true
          fi

      - name: Upload extracted tree
        uses: actions/upload-artifact@v4
        with:
          name: extracted-tree
          path: ${{ env.WORK_DIR }}/extracted
          retention-days: 3
          compression-level: 0

  patch:
    name: Patch RPATH
    runs-on: ubuntu-22.04
    needs: extract
    timeout-minutes: 20
    steps:
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Download tree
        uses: actions/download-artifact@v4
        with:
          name: extracted-tree
          path: ${{ env.WORK_DIR }}/extracted
      - name: Patch ELF binaries
        run: |
          cd "$WORK_DIR/extracted"
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "ELF"; then patchelf --set-rpath '$ORIGIN/../lib' "$file" 2>/dev/null || true; fi
          done < <(find bin -type f -print0 2>/dev/null)
          
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "ELF"; then patchelf --set-rpath '$ORIGIN' "$file" 2>/dev/null || true; fi
          done < <(find lib -type f -name '*.so*' -print0 2>/dev/null)

          if [ -d opt ]; then
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q "ELF"; then patchelf --set-rpath '$ORIGIN/../../lib' "$file" 2>/dev/null || true; fi
            done < <(find opt -type f -executable -print0 2>/dev/null)
          fi

          if [ -d lib/jvm ]; then
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q "ELF"; then patchelf --set-rpath '$ORIGIN/../../../lib' "$file" 2>/dev/null || true; fi
            done < <(find lib/jvm -type f \( -name 'java' -o -name 'javac' -o -name 'jar' -o -name 'keytool' \) -print0 2>/dev/null)
          fi
      - name: Upload patched tree
        uses: actions/upload-artifact@v4
        with:
          name: patched-tree
          path: ${{ env.WORK_DIR }}/extracted
          retention-days: 3
          compression-level: 0

  package:
    name: Package tarball
    runs-on: ubuntu-22.04
    needs: patch
    timeout-minutes: 20
    steps:
      - name: Download tree
        uses: actions/download-artifact@v4
        with:
          name: patched-tree
          path: ${{ env.WORK_DIR }}/extracted
      - name: Pack tarball
        run: |
          cd "$WORK_DIR/extracted"
          tar -cJhf "../$TARBALL_NAME.tar.xz" .
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ env.WORK_DIR }}/${{ env.TARBALL_NAME }}.tar.xz
          retention-days: 14
          compression-level: 0

  release:
    name: Create release
    runs-on: ubuntu-22.04
    needs: [preflight, package]
    timeout-minutes: 30
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball
          path: ${{ env.WORK_DIR }}
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/releases/tags/$TAG")
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            UPLOAD_URL=$(echo "$EXISTING" | jq -r '.upload_url' | sed 's/{?name,label}//')
          else
            CREATED=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Toolchain $TAG\"}")
            RELEASE_ID=$(echo "$CREATED" | jq -r '.id')
            UPLOAD_URL=$(echo "$CREATED" | jq -r '.upload_url' | sed 's/{?name,label}//')
          fi

          ASSET_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/releases/tags/$TAG" | jq -r ".assets[] | select(.name==\"$TARBALL_NAME.tar.xz\") | .id")
          if [ -n "$ASSET_ID" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "$API/releases/assets/$ASSET_ID"
          fi

          cd "$WORK_DIR"
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$TARBALL_NAME.tar.xz" \
            "$UPLOAD_URL?name=$TARBALL_NAME.tar.xz"
